<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schede Studio - Patente B</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background-color: #121212; color: #e0e0e0; }
        
        /* Centered Home Button */
        .top-nav { text-align: center; margin-bottom: 15px; }
        .btn-home { background: #333; color: #fff; text-decoration: none; padding: 10px 25px; border-radius: 8px; font-size: 1.1em; font-weight: bold; display: inline-block; transition: 0.2s; border: 1px solid #555; }
        .btn-home:hover { background: #444; border-color: #2ea043; transform: translateY(-2px); }
        
        .menu-bar { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 15px; }
        .filters { display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
        .filters select { flex: 1; min-width: 250px; max-width: 400px; padding: 10px; font-size: 1.1em; border-radius: 5px; cursor: pointer; background-color: #2c2c2c; color: #e0e0e0; border: 1px solid #444; }
        .filters select optgroup { font-weight: bold; color: #aaa; font-style: normal; }
        .btn-flag-review { background-color: #b07005; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 1.1em; cursor: pointer; font-weight: bold; transition: 0.2s; white-space: nowrap; }
        .btn-flag-review:hover { background-color: #d1870a; }
        #message-area { text-align: center; font-size: 1.2em; color: #aaaaaa; margin-top: 40px; font-style: italic; }
        
        .error-box { background: #ff5252; color: white; padding: 15px; border-radius: 5px; margin: 20px auto; max-width: 600px; font-weight: bold; }
        
        .study-card { background: #1e1e1e; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .image-wrapper { text-align: center; width: 100%; }
        .study-card img { max-width: 100%; max-height: 250px; border-radius: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .questions-wrapper { width: 100%; }
        
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; width: 100%; align-items: stretch; }
        .grid-header { font-size: 1.3em; font-weight: bold; padding-bottom: 10px; border-bottom: 2px solid #444; text-align: center; }
        .v-head { color: #4caf50; }
        .f-head { color: #ff5252; }
        
        .cell-card { padding: 12px 15px; background: #2c2c2c; border-radius: 6px; line-height: 1.4; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; transition: background 0.2s; font-size: 1.05em; border: 1px solid transparent; }
        .v-card { border-left: 5px solid #4caf50; }
        .f-card { border-left: 5px solid #ff5252; }
        
        /* NEW: Special Trick Question Styling */
        .matched-pair { border-top: 1px solid #9c27b0; border-right: 1px solid #9c27b0; border-bottom: 1px solid #9c27b0; background-color: #231c26; box-shadow: inset 0 0 8px rgba(156, 39, 176, 0.1); }
        .matched-pair.v-card { border-left: 5px solid #4caf50; }
        .matched-pair.f-card { border-left: 5px solid #ff5252; }
        
        .empty-cell { background: transparent; border: none; }
        
        .flag-btn { background: none; border: none; cursor: pointer; font-size: 1.2em; opacity: 0.3; filter: grayscale(100%); transition: 0.2s; padding: 0; margin: 0; flex-shrink: 0; }
        .cell-card.is-flagged { background: #3d3014; }
        .cell-card.is-flagged .flag-btn { opacity: 1; filter: none; }

        .clickable-word { cursor: pointer; border-bottom: 1px dotted #888; transition: 0.2s; padding: 0 2px; display: inline-block; }
        .clickable-word:hover { background-color: #0056b3; color: white; border-radius: 3px; }
        
        #translation-panel { 
            display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            background: #1e1e1e; border: 2px solid #2ea043; color: white; padding: 30px 20px 20px 20px; 
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 1000; 
            text-align: left; min-width: 300px; max-width: 90%; font-size: 1.1em; 
        }
        .close-btn { position: absolute; top: 5px; right: 15px; cursor: pointer; color: #aaa; font-size: 1.8em; font-weight: bold; transition: 0.2s; line-height: 1; }
        .close-btn:hover { color: #fff; }
        .tr-row { margin-bottom: 10px; }
        .tr-label { color: #888; font-size: 0.9em; text-transform: uppercase; }
        .tr-it { font-weight: bold; }
        .tr-en { color: #ffeb3b; font-weight: bold; }
        .tr-sentence { border-top: 1px solid #444; padding-top: 10px; margin-top: 10px; font-size: 0.95em; line-height: 1.4; color: #ccc; }
        .tr-sentence .tr-en { color: #4caf50; font-weight: normal; }

        @media (max-width: 800px) {
            .study-card { padding: 10px; }
            .comparison-grid { display: flex; flex-direction: column; gap: 10px; }
            .grid-header { display: none; }
            .empty-cell { display: none; }
            #translation-panel { width: 90%; font-size: 1em; padding: 30px 15px 15px 15px; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/" class="btn-home">← Torna alla Home</a>
    </div>
    
    <div class="menu-bar">
        <div class="filters">
            <select id="category-select" onchange="onCategoryChange()">
                <option value="all">1. Scegli il Capitolo...</option>
            </select>
            <button class="btn-flag-review" onclick="loadFlagged()">🚩 Ripassa Salvate</button>
        </div>
        <div class="filters">
            <select id="subcategory-select" onchange="onSubcategoryChange()" disabled>
                <option value="all">2. Scegli l'Argomento...</option>
            </select>
            <select id="figure-select" onchange="loadContent()" disabled>
                <option value="all">3. Tutte le Figure</option>
            </select>
        </div>
    </div>
    
    <div id="message-area">Caricamento in corso...</div>
    <div id="content-container"></div>
    <div id="translation-panel"></div>
    
    <script>
        let currentMode = 'normal';

        function cleanText(text) { 
            if (!text) return "Argomento Sconosciuto";
            return String(text).split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '); 
        }
        
        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                const data = await res.json();
                
                if (data.error) { document.getElementById('message-area').innerHTML = `<div class="error-box">${data.error}</div>`; return; }
                
                const select = document.getElementById('category-select');
                const total = data.reduce((sum, cat) => sum + cat.count, 0);
                select.innerHTML = `<option value="all">1. Scegli il Capitolo (${total})</option>`;
                
                let impGroup = document.createElement('optgroup');
                impGroup.label = "15 Argomenti Più Importanti (Alta Priorità)";
                
                let lessGroup = document.createElement('optgroup');
                lessGroup.label = "10 Argomenti Meno Importanti";
                
                data.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = `${cleanText(cat.name)} (${cat.count})`;
                    
                    if (cat.is_important) impGroup.appendChild(option);
                    else lessGroup.appendChild(option);
                });
                
                select.appendChild(impGroup);
                select.appendChild(lessGroup);
                document.getElementById('message-area').innerText = "Seleziona un Capitolo (1) per iniziare.";
            } catch (err) {
                document.getElementById('message-area').innerHTML = `<div class="error-box">Errore Fatale: Impossibile leggere il database.</div>`;
            }
        }

        async function onCategoryChange() {
            const catSelect = document.getElementById('category-select');
            const subSelect = document.getElementById('subcategory-select');
            const figSelect = document.getElementById('figure-select');
            
            subSelect.innerHTML = '<option value="all">2. Scegli l\'Argomento...</option>';
            figSelect.innerHTML = '<option value="all">3. Tutte le Figure</option>';
            document.getElementById('content-container').innerHTML = '';
            
            if (catSelect.value === 'all') {
                subSelect.disabled = true; figSelect.disabled = true;
                document.getElementById('message-area').innerText = "Seleziona un Capitolo (1) per iniziare.";
            } else {
                subSelect.disabled = false; figSelect.disabled = true;
                try {
                    const res = await fetch(`/api/subcategories?category=${encodeURIComponent(catSelect.value)}`);
                    const subcats = await res.json();
                    
                    if (subcats.error) { document.getElementById('message-area').innerHTML = `<div class="error-box">${subcats.error}</div>`; return; }
                    
                    const total = subcats.reduce((sum, sub) => sum + sub.count, 0);
                    subSelect.innerHTML = `<option value="all">2. Scegli l'Argomento (${total})</option>`;
                    
                    subcats.forEach(sub => {
                        const option = document.createElement('option');
                        option.value = sub.name;
                        option.textContent = `${cleanText(sub.name)} (${sub.count})`;
                        subSelect.appendChild(option);
                    });
                    document.getElementById('message-area').innerText = "Seleziona un Argomento (2) o usa il tasto 🚩 Ripassa Salvate.";
                } catch(err) { document.getElementById('message-area').innerHTML = `<div class="error-box">Errore durante il caricamento.</div>`; }
            }
        }

        async function onSubcategoryChange() {
            const catSelect = document.getElementById('category-select');
            const subSelect = document.getElementById('subcategory-select');
            const figSelect = document.getElementById('figure-select');
            figSelect.innerHTML = '<option value="all">3. Tutte le Figure</option>';
            
            if (subSelect.value === 'all') {
                figSelect.disabled = true;
                document.getElementById('content-container').innerHTML = '';
                document.getElementById('message-area').innerText = "Seleziona un Argomento (2) per visualizzare le domande.";
            } else {
                figSelect.disabled = false;
                try {
                    const res = await fetch(`/api/figures?category=${encodeURIComponent(catSelect.value)}&subcategory=${encodeURIComponent(subSelect.value)}`);
                    const figures = await res.json();
                    
                    if (figures.error) { document.getElementById('message-area').innerHTML = `<div class="error-box">${figures.error}</div>`; return; }

                    const total = figures.reduce((sum, fig) => sum + fig.count, 0);
                    figSelect.innerHTML = `<option value="all">3. Tutte le Figure (${total})</option>`;
                    figures.forEach(fig => {
                        const option = document.createElement('option');
                        option.value = fig.name;
                        option.textContent = `Figura: ${fig.name.split('/').pop()} (${fig.count})`;
                        figSelect.appendChild(option);
                    });
                    loadContent(); 
                } catch(err) { document.getElementById('message-area').innerHTML = `<div class="error-box">Errore durante il caricamento.</div>`; }
            }
        }

        async function toggleFlag(id, newStatus, btnEl) {
            const card = btnEl.closest('.cell-card');
            if (newStatus === 1) {
                card.classList.add('is-flagged');
                btnEl.setAttribute('onclick', `toggleFlag(${id}, 0, this)`);
            } else {
                card.classList.remove('is-flagged');
                btnEl.setAttribute('onclick', `toggleFlag(${id}, 1, this)`);
                if (currentMode === 'flagged') card.style.display = 'none';
            }
            await fetch('/api/toggle_flag', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, flagged: newStatus })
            });
        }

        function makeWordsClickable(sentence) {
            return sentence.split(' ').map((word, i) => {
                return `<span class="clickable-word" data-index="${i}" onclick="handleWordClick(this)">${word}</span>`;
            }).join(' ');
        }

        function closeTranslation() {
            document.getElementById('translation-panel').style.display = 'none';
        }

        async function handleWordClick(element) {
            const qTextSpan = element.closest('.question-text');
            const words = Array.from(qTextSpan.querySelectorAll('.clickable-word')).map(span => span.innerText);
            const i = parseInt(element.getAttribute('data-index'));
            
            const word = words[i];
            
            let chunk = [];
            if (i > 0) chunk.push(words[i-1]);
            chunk.push(word);
            if (i < words.length - 1) chunk.push(words[i+1]);
            
            const phrase = chunk.join(' ');
            const sentence = words.join(' ');
            
            const panel = document.getElementById('translation-panel');
            panel.innerHTML = `<span class="close-btn" onclick="closeTranslation()">&times;</span><div style="text-align:center; margin-top:10px;">Analisi contesto in corso... ⏳</div>`;
            panel.style.display = 'block';
            
            try {
                const res = await fetch('/api/translate_smart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: word, phrase: phrase, sentence: sentence })
                });
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);
                
                panel.innerHTML = `
                    <span class="close-btn" onclick="closeTranslation()">&times;</span>
                    <div class="tr-row" style="margin-top:5px;"><span class="tr-label">Parola:</span> <span class="tr-it">${word}</span> ➔ <span class="tr-en">${data.word}</span></div>
                    <div class="tr-row"><span class="tr-label">Contesto (3 Parole):</span> <span class="tr-it">${phrase}</span> ➔ <span class="tr-en">${data.phrase}</span></div>
                    <div class="tr-sentence">
                        <div style="margin-bottom:5px;"><em>"${sentence}"</em></div>
                        <div class="tr-en">➔ "${data.sentence}"</div>
                    </div>
                `;
            } catch (err) {
                panel.innerHTML = `<span class="close-btn" onclick="closeTranslation()">&times;</span><div style="text-align:center; color:#ff5252; margin-top:10px;">Errore di connessione.</div>`;
            }
        }

        function calculateSimilarity(str1, str2) {
            if(!str1 || !str2) return 0;
            const set1 = new Set(str1.toLowerCase().split(' '));
            const set2 = new Set(str2.toLowerCase().split(' '));
            let intersection = 0;
            for(let w of set1) if(set2.has(w)) intersection++;
            const union = set1.size + set2.size - intersection;
            return intersection / union;
        }
        
        function renderCell(q, type, isMatched) {
            const flagged = q.flagged === 1 ? 'is-flagged' : '';
            const nextStatus = q.flagged === 1 ? 0 : 1;
            const text = makeWordsClickable(q.domanda);
            const cardClass = type === 'v' ? 'v-card' : 'f-card';
            const matchedClass = isMatched ? 'matched-pair' : '';
            
            return `<div class="cell-card ${cardClass} ${flagged} ${matchedClass}">
                        <span class="question-text">${text}</span>
                        <button class="flag-btn" onclick="toggleFlag(${q.id}, ${nextStatus}, this)">🚩</button>
                    </div>`;
        }

        function buildComparisonGrid(veroList, falsoList) {
            veroList.sort((a, b) => a.domanda.localeCompare(b.domanda));
            falsoList.sort((a, b) => a.domanda.localeCompare(b.domanda));

            let matchedPairs = [];
            let unmatchedVero = [];
            let remainingFalso = [...falsoList];

            // 1. Find Trick Matches
            veroList.forEach(v => {
                let bestIdx = -1;
                let maxSim = 0;
                for(let i=0; i<remainingFalso.length; i++) {
                    let sim = calculateSimilarity(v.domanda, remainingFalso[i].domanda);
                    if(sim > maxSim && sim > 0.35) { 
                        maxSim = sim;
                        bestIdx = i;
                    }
                }
                
                if(bestIdx !== -1) {
                    let f = remainingFalso.splice(bestIdx, 1)[0];
                    matchedPairs.push({ v: v, f: f });
                } else {
                    unmatchedVero.push(v);
                }
            });

            let unmatchedFalso = remainingFalso;

            if(matchedPairs.length === 0 && unmatchedVero.length === 0 && unmatchedFalso.length === 0) return "";
            
            let html = `<div class="comparison-grid">
                            <div class="grid-header v-head">Vero</div>
                            <div class="grid-header f-head">Falso</div>`;
            
            // 2. Render Matched Pairs (Top of the grid, highlighted)
            matchedPairs.forEach(pair => {
                html += renderCell(pair.v, 'v', true);
                html += renderCell(pair.f, 'f', true);
            });
            
            // 3. Render Unmatched Items (Packed tightly to eliminate gaps)
            const maxLen = Math.max(unmatchedVero.length, unmatchedFalso.length);
            for(let i=0; i<maxLen; i++) {
                if(i < unmatchedVero.length) html += renderCell(unmatchedVero[i], 'v', false);
                else html += `<div class="empty-cell"></div>`;
                
                if(i < unmatchedFalso.length) html += renderCell(unmatchedFalso[i], 'f', false);
                else html += `<div class="empty-cell"></div>`;
            }
            
            html += `</div>`;
            return html;
        }

        async function loadFlagged() {
            const cat = document.getElementById('category-select').value;
            if (cat === 'all') { alert("Seleziona prima un Capitolo (1) per vedere le sue domande salvate!"); return; }
            
            document.getElementById('subcategory-select').value = 'all';
            document.getElementById('figure-select').innerHTML = '<option value="all">3. Tutte le Figure</option>';
            document.getElementById('figure-select').disabled = true;
            
            currentMode = 'flagged';
            fetchAndRender(cat, 'all', 'all', 'true');
        }

        async function loadContent() {
            const cat = document.getElementById('category-select').value;
            const sub = document.getElementById('subcategory-select').value;
            const fig = document.getElementById('figure-select').value;
            if (sub === 'all') return;
            currentMode = 'normal';
            fetchAndRender(cat, sub, fig, 'false');
        }

        async function fetchAndRender(cat, sub, fig, isFlagged) {
            const msgArea = document.getElementById('message-area');
            const container = document.getElementById('content-container');
            container.innerHTML = '';
            
            msgArea.innerText = "Caricamento in corso...";
            try {
                const url = `/api/content?category=${encodeURIComponent(cat)}&subcategory=${encodeURIComponent(sub)}&figure=${encodeURIComponent(fig)}&flagged_only=${isFlagged}`;
                const res = await fetch(url);
                const result = await res.json();
                
                if (result.error) { msgArea.innerHTML = `<div class="error-box">${result.error}</div>`; return; }
                if (result.message) { msgArea.innerText = result.message; return; }
                if (result.data.length === 0) { 
                    msgArea.innerText = isFlagged === 'true' ? "Nessuna domanda salvata in questo Capitolo." : "Nessuna domanda trovata."; return; 
                }
                
                msgArea.innerText = "";
                
                result.data.forEach(item => {
                    let html = `<div class="study-card">`;
                    if (item.figura && item.figura !== "no_image") {
                        html += `<div class="image-wrapper"><img src="/${item.figura}" alt="Segnale stradale"></div>`;
                    } else {
                        html += `<div class="image-wrapper" style="color: #444; font-style: italic; padding: 20px 0;">Nessuna figura</div>`;
                    }
                    html += `<div class="questions-wrapper">`;
                    
                    html += buildComparisonGrid(item.vero, item.falso);
                    
                    html += `</div></div>`;
                    container.innerHTML += html;
                });
            } catch (error) {
                msgArea.innerHTML = `<div class="error-box">Errore durante il caricamento dei dati.</div>`;
            }
        }
        
        loadCategories();
    </script>
</body>
</html>
