<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schede Studio - Patente B</title>
    <style>
        /* Sleek, Native Apple Typography Stack */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            font-weight: 300; 
            letter-spacing: -0.2px; 
            max-width: 1200px; margin: 0 auto; padding: 0 20px 60px 20px; 
            
            /* Ambient Dark Room Mesh Gradient */
            background-color: #0a0a0f;
            background-image: 
                radial-gradient(circle at 0% 0%, #161e30 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, #1b1624 0%, transparent 50%);
            background-attachment: fixed;
            
            color: #d1d5db; 
            line-height: 1.6;
        }

        /* UNPINNED COMPRESSED COMMAND CENTER */
        .menu-bar { 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 12px 15px; 
            border-radius: 16px; 
            margin: 25px 0; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap; 
            gap: 10px; 
            justify-content: center; 
            align-items: center; 
            border: 1px solid #334155; 
        }
        
        .btn-back-small { 
            background: rgba(30, 41, 59, 0.8); color: #cbd5e1; text-decoration: none; 
            padding: 10px 16px; border-radius: 8px; font-size: 0.95em; font-weight: 600; 
            border: 1px solid #475569; transition: 0.2s; white-space: nowrap; cursor: pointer;
            font-family: inherit;
        }
        .btn-back-small:hover { background: rgba(39, 55, 77, 0.9); color: #f8fafc; border-color: #38bdf8; }

        .menu-bar select { 
            flex: 1; min-width: 180px; max-width: 280px; padding: 10px 12px; font-size: 0.95em; 
            font-family: inherit; font-weight: 400; border-radius: 8px; cursor: pointer; 
            background-color: #0f172a; color: #f1f5f9; border: 1px solid #475569; 
            transition: border 0.2s; outline: none; 
        }
        .menu-bar select:focus { border-color: #38bdf8; }
        
        .btn-flag-review { 
            padding: 10px 16px; cursor: pointer; border: 1px solid #d97706; border-radius: 8px; 
            background: rgba(217, 119, 6, 0.2); color: #fcd34d; transition: 0.2s; 
            font-weight: 600; font-family: inherit; font-size: 0.95em; white-space: nowrap;
        }
        .btn-flag-review:hover { background: rgba(217, 119, 6, 0.4); color: #fff; }

        /* GLOBAL TRANSLATE TOGGLE */
        .global-lang-toggle { 
            display: flex; background: rgba(15, 23, 42, 0.8); border-radius: 8px; 
            border: 1px solid #475569; overflow: hidden; 
        }
        .global-lang-toggle button { 
            background: transparent; border: none; color: #94a3b8; padding: 8px 16px; 
            font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9em; letter-spacing: 0.5px; 
        }
        .global-lang-toggle button.active { background: #38bdf8; color: #0f172a; }
        .global-lang-toggle button:not(.active):hover { color: #f1f5f9; background: rgba(56, 189, 248, 0.15); }
        
        #message-area { text-align: center; font-size: 1.2em; color: #38bdf8; margin-top: 25px; margin-bottom: 25px; font-weight: 500; }
        .error-box { background: rgba(127, 29, 29, 0.8); backdrop-filter: blur(5px); color: #fca5a5; padding: 15px; border-radius: 12px; margin: 20px auto; max-width: 600px; font-weight: 500; border: 1px solid #991b1b; }
        
        /* THE GALLERY GRID & FIXED IMAGE WRAPPERS */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; width: 100%; margin-bottom: 40px; }
        .gallery-item { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 18px; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 8px 16px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative; overflow: hidden; }
        .gallery-item:hover { transform: translateY(-4px); background: rgba(39, 53, 73, 0.9); border-color: #38bdf8; box-shadow: 0 12px 25px rgba(56, 189, 248, 0.2); }
        
        .gallery-img-wrapper { 
            width: 100%; height: 140px; background: #ffffff; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; box-sizing: border-box; flex-shrink: 0;
        }
        .gallery-img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .gallery-card-info { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: center; }
        .gallery-title { font-size: 1.05em; font-weight: 600; color: #f8fafc; line-height: 1.3; }
        .gallery-count { font-size: 0.85em; color: #94a3b8; font-weight: 500; }

        /* Study Cards & Matching Grid */
        .study-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 20px; align-items: center; border: 1px solid #334155; }
        .image-wrapper { text-align: center; width: 100%; background: #ffffff; padding: 10px; border-radius: 12px; max-width: fit-content; margin: 0 auto; }
        .study-card img { max-width: 100%; max-height: 150px; border-radius: 8px; } 

        .questions-wrapper { width: 100%; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 20px; width: 100%; align-items: stretch; }
        
        .grid-header { font-size: 1.1em; font-weight: 600; padding-bottom: 8px; text-align: center; text-transform: uppercase; letter-spacing: 1.5px; }
        .v-head { color: #6ee7b7; border-bottom: 1px solid rgba(5, 150, 105, 0.5); }
        .f-head { color: #fca5a5; border-bottom: 1px solid rgba(225, 29, 72, 0.5); }
        
        .cell-card { padding: 15px 20px; background: rgba(39, 53, 73, 0.5); border-radius: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; font-size: 1.1em; font-weight: 400; color: #f8fafc; transition: all 0.2s ease; border: 1px solid transparent; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .cell-card:hover { transform: translateY(-2px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); background: rgba(39, 53, 73, 0.8); }
        
        .v-card { border-left: 4px solid #34d399; }
        .f-card { border-left: 4px solid #fb7185; }
        
        .matched-pair.v-card { background: linear-gradient(145deg, rgba(6, 78, 59, 0.6) 0%, rgba(30, 41, 59, 0.8) 100%); border: 1px solid rgba(52, 211, 153, 0.3); border-left: 6px solid #10b981; }
        .matched-pair.f-card { background: linear-gradient(145deg, rgba(136, 19, 55, 0.6) 0%, rgba(30, 41, 59, 0.8) 100%); border: 1px solid rgba(251, 113, 133, 0.3); border-left: 6px solid #e11d48; }
        
        .empty-cell { background: transparent; border: none; box-shadow: none; }
        .flag-btn { background: none; border: none; cursor: pointer; font-size: 1.3em; opacity: 0.2; filter: grayscale(100%); transition: all 0.2s; padding: 0; margin: 0; flex-shrink: 0; }
        .flag-btn:hover { opacity: 0.8; transform: scale(1.1); }
        .cell-card.is-flagged { background: rgba(69, 41, 26, 0.8); border-color: #9a3412; }
        .cell-card.is-flagged .flag-btn { opacity: 1; filter: none; }

        .clickable-word { cursor: pointer; transition: color 0.2s; display: inline; padding: 2px 0; }
        .clickable-word:hover { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
        
        #translation-panel { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8; color: #f1f5f9; padding: 25px 30px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 10px 10px -5px rgba(0,0,0,0.3); z-index: 1000; text-align: left; min-width: 320px; max-width: 90%; font-size: 1.1em; backdrop-filter: blur(10px); }
        .close-btn { position: absolute; top: 12px; right: 18px; cursor: pointer; color: #64748b; font-size: 1.8em; font-weight: 400; transition: color 0.2s; line-height: 1; }
        .close-btn:hover { color: #f1f5f9; }
        
        .tr-row { margin-bottom: 12px; }
        .tr-label { color: #94a3b8; font-size: 0.85em; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 2px; }
        .tr-it { font-weight: 400; color: #e2e8f0; }
        .tr-en { color: #38bdf8; font-weight: 500; margin-left: 8px; }
        .tr-sentence { border-top: 1px solid rgba(51, 65, 85, 0.5); padding-top: 15px; margin-top: 15px; font-size: 0.95em; line-height: 1.5; color: #cbd5e1; }

        @media (max-width: 800px) {
            body { padding: 0 10px 40px 10px; }
            .menu-bar { padding: 10px; margin: 15px 0; gap: 8px; border-radius: 12px; }
            .menu-bar select, .btn-flag-review, .btn-back-small, .global-lang-toggle { width: 100%; text-align: center; }
            .global-lang-toggle button { flex: 1; }
            .comparison-grid { display: flex; flex-direction: column; gap: 6px; }
            .grid-header, .empty-cell { display: none; }
        }
    </style>
</head>
<body>
    
    <div class="menu-bar">
        <button class="btn-back-small" onclick="goBack()">← Indietro</button>
        <select class="category-select" onchange="onCategoryChange(this)">
            <option value="all">1. Scegli il Capitolo...</option>
        </select>
        <select class="subcategory-select" onchange="onSubcategoryChange(this)" disabled>
            <option value="all">2. Scegli l'Argomento...</option>
        </select>
        <select class="figure-select" onchange="onFigureChange(this)" disabled>
            <option value="all">3. Tutte le Figure</option>
        </select>
        <button class="btn-flag-review" onclick="loadFlagged()">🚩 Ripassa Salvate</button>
        <div class="global-lang-toggle">
            <button class="g-lang-it active" onclick="setGlobalLang('it')">IT</button>
            <button class="g-lang-en" onclick="setGlobalLang('en')">EN</button>
        </div>
    </div>
    
    <div id="message-area">Seleziona un Capitolo per iniziare o esplora i capitoli principali:</div>
    <div id="content-container"></div>
    <div id="translation-panel"></div>

    <div class="menu-bar" style="margin-top: 30px;">
        <button class="btn-back-small" onclick="goBack()">← Indietro</button>
        <select class="category-select" onchange="onCategoryChange(this)">
            <option value="all">1. Scegli il Capitolo...</option>
        </select>
        <select class="subcategory-select" onchange="onSubcategoryChange(this)" disabled>
            <option value="all">2. Scegli l'Argomento...</option>
        </select>
        <select class="figure-select" onchange="onFigureChange(this)" disabled>
            <option value="all">3. Tutte le Figure</option>
        </select>
        <button class="btn-flag-review" onclick="loadFlagged()">🚩 Ripassa Salvate</button>
        <div class="global-lang-toggle">
            <button class="g-lang-it active" onclick="setGlobalLang('it')">IT</button>
            <button class="g-lang-en" onclick="setGlobalLang('en')">EN</button>
        </div>
    </div>
    
    <script>
        let currentMode = 'normal';
        let currentLang = 'it';
        let translationCache = {};
        let cachedCategoriesData = [];

        async function translateTextAPI(text) {
            if (!text || text === "N/A") return text;
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=it&tl=en&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            return data[0].map(item => item[0]).join('');
        }

        function setGlobalLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.g-lang-it').forEach(el => el.classList.toggle('active', lang === 'it'));
            document.querySelectorAll('.g-lang-en').forEach(el => el.classList.toggle('active', lang === 'en'));
            applyLanguageToQuestions();
        }

        function applyLanguageToQuestions() {
            const questions = document.querySelectorAll('.question-text');
            questions.forEach(q => {
                if (!q.hasAttribute('data-it-text')) {
                    q.setAttribute('data-it-text', q.innerText.replace(/\s+/g, ' ').trim());
                }
                const itText = q.getAttribute('data-it-text');

                if (currentLang === 'it') {
                    q.innerHTML = makeWordsClickable(itText);
                } else {
                    if (translationCache[itText]) {
                        q.innerHTML = makeWordsClickable(translationCache[itText]);
                    } else {
                        q.innerHTML = "<span style='color:#38bdf8; font-size: 0.9em;'>Translating... ⏳</span>";
                        translateTextAPI(itText).then(enText => {
                            translationCache[itText] = enText;
                            if (currentLang === 'en') {
                                q.innerHTML = makeWordsClickable(enText);
                            }
                        }).catch(() => {
                            if (currentLang === 'en') q.innerHTML = makeWordsClickable(itText);
                        });
                    }
                }
            });
        }

        function sanitizeId(str) { return str.replace(/[^a-zA-Z0-9]/g, '_'); }
        function syncSelects(className, value) { document.querySelectorAll('.' + className).forEach(el => el.value = value); }
        function cleanText(text) { 
            if (!text) return "Argomento Sconosciuto";
            return String(text).split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '); 
        }
        
        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                const data = await res.json();
                
                cachedCategoriesData = data;
                
                const total = data.reduce((sum, cat) => sum + cat.count, 0);
                
                let optionsHTML = `<option value="all">1. Scegli il Capitolo (${total})</option>`;
                data.forEach(cat => {
                    optionsHTML += `<option value="${cat.name}">${cleanText(cat.name)} (${cat.count})</option>`;
                });
                
                document.querySelectorAll('.category-select').forEach(el => el.innerHTML = optionsHTML);

                renderCategoriesGallery(data);
            } catch (err) {}
        }

        function renderCategoriesGallery(data) {
            const msgArea = document.getElementById('message-area');
            const container = document.getElementById('content-container');
            
            msgArea.innerText = "Seleziona un Capitolo per iniziare o esplora i capitoli principali:";
            
            let galleryHTML = '<div class="gallery-grid">';
            data.forEach(cat => {
                const safeName = cat.name.replace(/'/g, "\\'");

                galleryHTML += `
                    <div class="gallery-item" onclick="diveIntoCategory('${safeName}')">
                        <div class="gallery-img-wrapper" id="cat-img-${sanitizeId(cat.name)}">
                            <div class="no-img-square loading-spinner">⏳</div>
                        </div>
                        <div class="gallery-card-info">
                            <div class="gallery-title">${cleanText(cat.name)}</div>
                            <div class="gallery-count">${cat.count} domande</div>
                        </div>
                    </div>
                `;
            });
            galleryHTML += '</div>';
            container.innerHTML = galleryHTML;

            data.forEach(async (cat) => {
                try {
                    const subRes = await fetch(`/api/subcategories?category=${encodeURIComponent(cat.name)}`);
                    const subcats = await subRes.json();
                    if (subcats.length > 0) {
                        const figRes = await fetch(`/api/figures?category=${encodeURIComponent(cat.name)}&subcategory=${encodeURIComponent(subcats[0].name)}`);
                        const figures = await figRes.json();
                        const wrapper = document.getElementById(`cat-img-${sanitizeId(cat.name)}`);
                        if(wrapper) {
                            let firstFig = figures.find(f => f.name && f.name !== 'no_image' && f.name !== 'all');
                            if(firstFig) wrapper.innerHTML = `<img src="/${firstFig.name}" loading="lazy" alt="Anteprima">`;
                            else wrapper.innerHTML = `<div class="no-img-square" style="font-size:0.8em;">Nessuna Immagine</div>`;
                        }
                    }
                } catch(e) {}
            });
        }

        function diveIntoCategory(catName) {
            syncSelects('category-select', catName);
            onCategoryChange(document.querySelector('.category-select'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function diveIntoSubcategory(subName) {
            syncSelects('subcategory-select', subName);
            onSubcategoryChange(document.querySelector('.subcategory-select'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            const catVal = document.querySelector('.category-select').value;
            const subVal = document.querySelector('.subcategory-select').value;

            if (subVal !== 'all') {
                syncSelects('figure-select', 'all');
                syncSelects('subcategory-select', 'all');
                onCategoryChange(document.querySelector('.category-select'));
            } else if (catVal !== 'all') {
                syncSelects('category-select', 'all');
                onCategoryChange(document.querySelector('.category-select'));
            } else {
                window.location.href = '/';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function onCategoryChange(element) {
            const val = element ? element.value : document.querySelector('.category-select').value;
            syncSelects('category-select', val);
            
            document.querySelectorAll('.subcategory-select').forEach(el => { el.innerHTML = '<option value="all">2. Scegli l\'Argomento...</option>'; el.disabled = true; });
            document.querySelectorAll('.figure-select').forEach(el => { el.innerHTML = '<option value="all">3. Tutte le Figure</option>'; el.disabled = true; });
            document.getElementById('content-container').innerHTML = '';
            
            if (val === 'all') {
                renderCategoriesGallery(cachedCategoriesData);
            } else {
                document.querySelectorAll('.subcategory-select').forEach(el => el.disabled = false);
                try {
                    const res = await fetch(`/api/subcategories?category=${encodeURIComponent(val)}`);
                    const subcats = await res.json();
                    
                    const total = subcats.reduce((sum, sub) => sum + sub.count, 0);
                    let subHTML = `<option value="all">2. Scegli l'Argomento (${total})</option>`;
                    subcats.forEach(sub => { subHTML += `<option value="${sub.name}">${cleanText(sub.name)} (${sub.count})</option>`; });
                    document.querySelectorAll('.subcategory-select').forEach(el => el.innerHTML = subHTML);
                    
                    document.getElementById('message-area').innerHTML = `Capitolo Selezionato: <b>${cleanText(val)}</b>. Esplora gli argomenti sottostanti o seleziona dal menu in alto:`;
                    let galleryHTML = '<div class="gallery-grid">';
                    subcats.forEach(sub => {
                        const safeName = sub.name.replace(/'/g, "\\'");
                        galleryHTML += `
                            <div class="gallery-item" onclick="diveIntoSubcategory('${safeName}')">
                                <div class="gallery-img-wrapper" id="gal-img-${sanitizeId(sub.name)}">
                                    <div class="no-img-square loading-spinner">⏳</div>
                                </div>
                                <div class="gallery-card-info">
                                    <div class="gallery-title">${cleanText(sub.name)}</div>
                                    <div class="gallery-count">${sub.count} domande</div>
                                </div>
                            </div>
                        `;
                    });
                    galleryHTML += '</div>';
                    document.getElementById('content-container').innerHTML = galleryHTML;

                    subcats.forEach(async (sub) => {
                        try {
                            const figRes = await fetch(`/api/figures?category=${encodeURIComponent(val)}&subcategory=${encodeURIComponent(sub.name)}`);
                            const figures = await figRes.json();
                            const wrapper = document.getElementById(`gal-img-${sanitizeId(sub.name)}`);
                            if(wrapper) {
                                let firstFig = figures.find(f => f.name && f.name !== 'no_image' && f.name !== 'all');
                                if(firstFig) wrapper.innerHTML = `<img src="/${firstFig.name}" loading="lazy" alt="Anteprima">`;
                                else wrapper.innerHTML = `<div class="no-img-square" style="font-size:0.8em;">Nessuna Immagine</div>`;
                            }
                        } catch(e) {}
                    });
                } catch(err) {}
            }
        }

        async function onSubcategoryChange(element) {
            const catVal = document.querySelector('.category-select').value;
            const subVal = element ? element.value : document.querySelector('.subcategory-select').value;
            syncSelects('subcategory-select', subVal);
            
            document.querySelectorAll('.figure-select').forEach(el => { el.innerHTML = '<option value="all">3. Tutte le Figure</option>'; });
            
            if (subVal === 'all') {
                document.querySelectorAll('.figure-select').forEach(el => el.disabled = true);
                onCategoryChange(document.querySelector('.category-select'));
            } else {
                document.querySelectorAll('.figure-select').forEach(el => el.disabled = false);
                try {
                    const res = await fetch(`/api/figures?category=${encodeURIComponent(catVal)}&subcategory=${encodeURIComponent(subVal)}`);
                    const figures = await res.json();
                    
                    const total = figures.reduce((sum, fig) => sum + fig.count, 0);
                    let figHTML = `<option value="all">3. Tutte le Figure (${total})</option>`;
                    figures.forEach(fig => { figHTML += `<option value="${fig.name}">Figura: ${fig.name.split('/').pop()} (${fig.count})</option>`; });
                    document.querySelectorAll('.figure-select').forEach(el => el.innerHTML = figHTML);
                    loadContent(); 
                } catch(err) {}
            }
        }

        function onFigureChange(element) {
            syncSelects('figure-select', element.value);
            loadContent();
        }

        async function toggleFlag(id, newStatus, btnEl) {
            const card = btnEl.closest('.cell-card');
            if (newStatus === 1) {
                card.classList.add('is-flagged');
                btnEl.setAttribute('onclick', `toggleFlag(${id}, 0, this)`);
            } else {
                card.classList.remove('is-flagged');
                btnEl.setAttribute('onclick', `toggleFlag(${id}, 1, this)`);
                if (currentMode === 'flagged') card.style.display = 'none';
            }
            await fetch('/api/toggle_flag', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, flagged: newStatus })
            });
        }

        function makeWordsClickable(sentence) {
            return sentence.split(' ').map((word, i) => { return `<span class="clickable-word" data-index="${i}" onclick="handleWordClick(this)">${word}</span>`; }).join(' ');
        }

        function closeTranslation() { document.getElementById('translation-panel').style.display = 'none'; }

        async function handleWordClick(element) {
            const qTextSpan = element.closest('.question-text');
            const words = Array.from(qTextSpan.querySelectorAll('.clickable-word')).map(span => span.innerText);
            const i = parseInt(element.getAttribute('data-index'));
            
            const word = words[i];
            let chunk = [];
            if (i > 0) chunk.push(words[i-1]);
            chunk.push(word);
            if (i < words.length - 1) chunk.push(words[i+1]);
            
            const phrase = chunk.join(' ');
            const sentence = words.join(' ');
            
            const panel = document.getElementById('translation-panel');
            panel.innerHTML = `<span class="close-btn" onclick="closeTranslation()">&times;</span><div style="text-align:center; margin-top:10px; color: #38bdf8; font-weight: 500;">Analisi contesto in corso... ⏳</div>`;
            panel.style.display = 'block';
            
            try {
                const res = await fetch('/api/translate_smart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: word, phrase: phrase, sentence: sentence })
                });
                const data = await res.json();
                
                panel.innerHTML = `
                    <span class="close-btn" onclick="closeTranslation()">&times;</span>
                    <div class="tr-row"><span class="tr-label">Parola</span><span class="tr-it">${word}</span> <span style="color:#64748b; margin:0 5px;">➔</span> <span class="tr-en">${data.word}</span></div>
                    <div class="tr-row"><span class="tr-label">Contesto (3 Parole)</span><span class="tr-it">${phrase}</span> <span style="color:#64748b; margin:0 5px;">➔</span> <span class="tr-en">${data.phrase}</span></div>
                    <div class="tr-sentence"><em>"${sentence}"</em><span class="tr-en">"${data.sentence}"</span></div>
                `;
            } catch (err) {
                panel.innerHTML = `<span class="close-btn" onclick="closeTranslation()">&times;</span><div style="text-align:center; color:#fca5a5; margin-top:10px;">Errore di connessione.</div>`;
            }
        }

        function calculateSimilarity(str1, str2) {
            if(!str1 || !str2) return 0;
            const set1 = new Set(str1.toLowerCase().split(' '));
            const set2 = new Set(str2.toLowerCase().split(' '));
            let intersection = 0;
            for(let w of set1) if(set2.has(w)) intersection++;
            return intersection / (set1.size + set2.size - intersection);
        }
        
        function renderCell(q, type, isMatched) {
            const flagged = q.flagged === 1 ? 'is-flagged' : '';
            const nextStatus = q.flagged === 1 ? 0 : 1;
            const text = makeWordsClickable(q.domanda);
            const cardClass = type === 'v' ? 'v-card' : 'f-card';
            const matchedClass = isMatched ? 'matched-pair' : '';
            
            return `<div class="cell-card ${cardClass} ${flagged} ${matchedClass}">
                        <span class="question-text">${text}</span>
                        <button class="flag-btn" onclick="toggleFlag(${q.id}, ${nextStatus}, this)">🚩</button>
                    </div>`;
        }

        function buildComparisonGrid(veroList, falsoList) {
            veroList.sort((a, b) => a.domanda.localeCompare(b.domanda, undefined, { numeric: true, sensitivity: 'base' }));
            falsoList.sort((a, b) => a.domanda.localeCompare(b.domanda, undefined, { numeric: true, sensitivity: 'base' }));
            
            let matchedPairs = [], unmatchedVero = [], remainingFalso = [...falsoList];

            veroList.forEach(v => {
                let bestIdx = -1, maxSim = 0;
                for(let i=0; i<remainingFalso.length; i++) {
                    let sim = calculateSimilarity(v.domanda, remainingFalso[i].domanda);
                    if(sim > maxSim && sim > 0.35) { maxSim = sim; bestIdx = i; }
                }
                if(bestIdx !== -1) { matchedPairs.push({ v: v, f: remainingFalso.splice(bestIdx, 1)[0] }); } 
                else { unmatchedVero.push(v); }
            });

            if(matchedPairs.length === 0 && unmatchedVero.length === 0 && remainingFalso.length === 0) return "";
            
            let html = `<div class="comparison-grid"><div class="grid-header v-head">Vero</div><div class="grid-header f-head">Falso</div>`;
            matchedPairs.forEach(pair => { html += renderCell(pair.v, 'v', true) + renderCell(pair.f, 'f', true); });
            
            const maxLen = Math.max(unmatchedVero.length, remainingFalso.length);
            for(let i=0; i<maxLen; i++) {
                html += (i < unmatchedVero.length) ? renderCell(unmatchedVero[i], 'v', false) : `<div class="empty-cell"></div>`;
                html += (i < remainingFalso.length) ? renderCell(remainingFalso[i], 'f', false) : `<div class="empty-cell"></div>`;
            }
            return html + `</div>`;
        }

        async function loadFlagged() {
            const cat = document.querySelector('.category-select').value;
            if (cat === 'all') { alert("Seleziona prima un Capitolo (1) per vedere le sue domande salvate!"); return; }
            syncSelects('subcategory-select', 'all');
            document.querySelectorAll('.figure-select').forEach(el => { el.innerHTML = '<option value="all">3. Tutte le Figure</option>'; el.disabled = true; });
            currentMode = 'flagged'; fetchAndRender(cat, 'all', 'all', 'true');
        }

        async function loadContent() {
            const cat = document.querySelector('.category-select').value;
            const sub = document.querySelector('.subcategory-select').value;
            const fig = document.querySelector('.figure-select').value;
            if (sub === 'all') return;
            currentMode = 'normal'; fetchAndRender(cat, sub, fig, 'false');
        }

        async function fetchAndRender(cat, sub, fig, isFlagged) {
            const msgArea = document.getElementById('message-area');
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            msgArea.innerText = "Caricamento in corso...";
            try {
                const res = await fetch(`/api/content?category=${encodeURIComponent(cat)}&subcategory=${encodeURIComponent(sub)}&figure=${encodeURIComponent(fig)}&flagged_only=${isFlagged}`);
                const result = await res.json();
                
                if (result.error) { msgArea.innerHTML = `<div class="error-box">${result.error}</div>`; return; }
                if (result.message) { msgArea.innerText = result.message; return; }
                if (result.data.length === 0) { msgArea.innerText = isFlagged === 'true' ? "Nessuna domanda salvata." : "Nessuna domanda trovata."; return; }
                
                msgArea.innerText = "";
                
                result.data.forEach((item) => {
                    let html = `<div class="study-card">`;
                    if (item.figura && item.figura !== "no_image") {
                        html += `<div class="image-wrapper"><img src="/${item.figura}" alt="Segnale stradale"></div>`;
                    } else {
                        html += `<div class="image-wrapper" style="color: #64748b; font-style: italic; background: transparent; padding: 5px;">Nessuna figura associata</div>`;
                    }
                    html += `<div class="questions-wrapper">` + buildComparisonGrid(item.vero, item.falso) + `</div></div>`;
                    container.innerHTML += html;
                });

                if (currentLang === 'en') {
                    applyLanguageToQuestions();
                }

            } catch (error) {}
        }
        
        loadCategories();
    </script>
</body>
</html>
