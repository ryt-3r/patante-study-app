<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patente B - Hub</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }
        h1 { font-size: 3em; margin-bottom: 40px; text-align: center; color: #ffffff; }
        .button-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        
        .hub-button {
            background-color: #1e1e1e;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 30px 40px;
            font-size: 1.3em;
            font-weight: bold;
            color: #e0e0e0;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
            min-width: 220px;
        }
        .hub-button:hover { background-color: #2c2c2c; transform: translateY(-5px); }
        
        .btn-study:hover { border-color: #2ea043; box-shadow: 0 15px 25px rgba(46, 160, 67, 0.2); }
        .btn-practice:hover { border-color: #3b82f6; box-shadow: 0 15px 25px rgba(59, 130, 246, 0.2); }
        .btn-exam { border-color: #8b0000; } /* Dark red default for exam */
        .btn-exam:hover { border-color: #ff5252; box-shadow: 0 15px 25px rgba(255, 82, 82, 0.2); }
        
        .icon { font-size: 2.5em; display: block; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>Patente B</h1>
    
    <div class="button-container">
        <a href="/domande" class="hub-button btn-study">
            <span class="icon">📚</span>
            STUDIA DOMANDE
        </a>
        <a href="/quiz" class="hub-button btn-practice">
            <span class="icon">🚦</span>
            PRATICA LIBERA
        </a>
        <a href="/official" class="hub-button btn-exam">
            <span class="icon">⏱️</span>
            ESAME UFFICIALE
        </a>
    </div>

</body>
</html>
