<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patente B - Hub</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 40px;
            text-align: center;
            color: #ffffff;
        }
        .button-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hub-button {
            background-color: #1e1e1e;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 40px 60px;
            font-size: 1.5em;
            font-weight: bold;
            color: #e0e0e0;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 200px;
        }
        .hub-button:hover {
            background-color: #2c2c2c;
            border-color: #2ea043;
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(46, 160, 67, 0.2);
        }
        .icon {
            font-size: 2.5em;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Patente B</h1>
    
    <div class="button-container">
        <a href="/quiz" class="hub-button">
            <span class="icon">🚦</span>
            SIMULA QUIZ
        </a>
        <a href="/domande" class="hub-button">
            <span class="icon">📚</span>
            STUDIA DOMANDE
        </a>
    </div>

</body>
</html>
