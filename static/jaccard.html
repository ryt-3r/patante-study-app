<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esame Jaccard - Patente B</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #121212; color: #e0e0e0; }
        .dashboard { text-align: center; margin-top: 50px; }
        .btn-main { background-color: #6a1b9a; color: white; border: none; padding: 20px 40px; border-radius: 8px; font-size: 1.5em; cursor: pointer; font-weight: bold; margin: 20px; transition: 0.3s; }
        .btn-main:hover { background-color: #e040fb; }
        
        .stats-panel { background: #1e1e1e; padding: 20px; border-radius: 8px; display: flex; justify-content: space-around; margin-top: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stat-box { text-align: center; }
        .stat-num { font-size: 2em; font-weight: bold; color: #ffb74d; }
        
        /* Exam UI */
        #exam-container { display: none; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .exam-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .timer { font-size: 2em; font-family: monospace; color: #ff5252; font-weight: bold; }
        
        .nav-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-bottom: 30px; }
        .nav-btn { background: #333; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .nav-btn.answered { background: #6a1b9a; }
        .nav-btn.active { border: 2px solid #ffb74d; background: #555; }
        
        .question-box { text-align: center; font-size: 1.4em; min-height: 250px; }
        .question-box img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-bottom: 20px; }
        
        .answer-controls { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .btn-ans { background: #333; color: white; border: 2px solid #555; padding: 15px 40px; font-size: 1.2em; border-radius: 8px; cursor: pointer; }
        .btn-ans.selected { border-color: #ffb74d; background: #444; }
        
        .guess-box { text-align: center; margin: 20px 0; padding: 15px; background: #2c2c2c; border-radius: 8px; }
        .guess-box input { transform: scale(1.5); margin-right: 10px; cursor: pointer; }
        
        .bottom-nav { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn-sub { background: #b07005; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold; }
        
        /* Results UI */
        #results-container { display: none; text-align: center; }
        .result-list { text-align: left; background: #1e1e1e; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .result-item { padding: 15px; border-bottom: 1px solid #333; margin-bottom: 10px; border-radius: 5px;}
        .res-correct { border-left: 5px solid #2ea043; background: #172b1a; }
        .res-wrong { border-left: 5px solid #ff5252; background: #301717; }
    </style>
</head>
<body>

    <div id="dashboard" class="dashboard">
        <h1>Esame Jaccard (Domande Trabocchetto)</h1>
        <button class="btn-main" onclick="startExam()">🏁 Avvia Esame Jaccard (30 Domande)</button>
        <div class="stats-panel" id="stats-panel">Caricamento statistiche...</div>
        <a href="/" style="display:block; margin-top:40px; color:#aaa;">Torna alla Home</a>
    </div>

    <div id="exam-container">
        <div class="exam-header">
            <h2 id="q-counter">Domanda 1 di 30</h2>
            <div class="timer" id="timer">20:00</div>
        </div>
        
        <div class="nav-grid" id="nav-grid"></div>
        
        <div class="question-box" id="question-box"></div>
        
        <div class="answer-controls">
            <button class="btn-ans" id="btn-vero" onclick="selectAnswer('V')">VERO</button>
            <button class="btn-ans" id="btn-falso" onclick="selectAnswer('F')">FALSO</button>
        </div>
        
        <div class="guess-box">
            <label>
                <input type="checkbox" id="guess-checkbox" onchange="toggleGuess()">
                ⚠️ Ho tirato a indovinare (Salva per ripetizione)
            </label>
        </div>
        
        <div class="bottom-nav">
            <button class="nav-btn" onclick="prevQ()">⬅ Precedente</button>
            <button class="btn-sub" onclick="submitExam()">Consegna Esame</button>
            <button class="nav-btn" onclick="nextQ()">Successiva ➡</button>
        </div>
    </div>
    
    <div id="results-container">
        <h1 id="result-title"></h1>
        <h2 id="result-score"></h2>
        <button class="btn-main" onclick="location.reload()">Torna alla Dashboard</button>
        <div class="result-list" id="result-list"></div>
    </div>

    <script>
        let questions = [];
        let answers = {};
        let currentIndex = 0;
        let timerInterval;
        let timeLeft = 20 * 60; 

        async function loadStats() {
            const res = await fetch('/api/jaccard_stats');
            const data = await res.json();
            document.getElementById('stats-panel').innerHTML = `
                <div class="stat-box">
                    <div class="stat-num">${data.unseen || 0}</div>
                    <div>Nuove (Mai Viste)</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" style="color:#ff5252;">${data.ever_wrong || 0}</div>
                    <div>Errori Permanenti Jaccard</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" style="color:#4caf50;">${data.ever_guessed || 0}</div>
                    <div>Indovinate/Salvate Jaccard</div>
                </div>
            `;
        }
        loadStats();

        async function startExam() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('exam-container').style.display = 'block';
            
            const res = await fetch('/api/generate_jaccard_exam');
            const data = await res.json();
            questions = data.questions;
            
            buildGrid();
            showQuestion(0);
            
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                if (timeLeft <= 0) submitExam();
            }, 1000);
        }

        function buildGrid() {
            const grid = document.getElementById('nav-grid');
            grid.innerHTML = '';
            for(let i=0; i<questions.length; i++) {
                grid.innerHTML += `<button class="nav-btn" id="grid-${i}" onclick="showQuestion(${i})">${i+1}</button>`;
            }
        }

        function showQuestion(index) {
            currentIndex = index;
            const q = questions[index];
            document.getElementById('q-counter').innerText = `Domanda ${index + 1} di ${questions.length}`;
            
            let html = '';
            if(q.figura && q.figura !== "no_image") html += `<img src="/${q.figura}">`;
            html += `<div>${q.domanda}</div>`;
            document.getElementById('question-box').innerHTML = html;
            
            document.getElementById('btn-vero').classList.remove('selected');
            document.getElementById('btn-falso').classList.remove('selected');
            document.getElementById('guess-checkbox').checked = false;
            
            if(answers[index]) {
                if(answers[index].ans === 'V') document.getElementById('btn-vero').classList.add('selected');
                if(answers[index].ans === 'F') document.getElementById('btn-falso').classList.add('selected');
                document.getElementById('guess-checkbox').checked = answers[index].guessed;
            }
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`grid-${index}`).classList.add('active');
        }

        function selectAnswer(ans) {
            if(!answers[currentIndex]) answers[currentIndex] = { guessed: false };
            answers[currentIndex].ans = ans;
            document.getElementById(`grid-${currentIndex}`).classList.add('answered');
            showQuestion(currentIndex); 
        }

        function toggleGuess() {
            if(!answers[currentIndex]) answers[currentIndex] = { ans: null };
            answers[currentIndex].guessed = document.getElementById('guess-checkbox').checked;
        }

        function prevQ() { if(currentIndex > 0) showQuestion(currentIndex - 1); }
        function nextQ() { if(currentIndex < questions.length - 1) showQuestion(currentIndex + 1); }

        async function submitExam() {
            clearInterval(timerInterval);
            document.getElementById('exam-container').style.display = 'none';
            document.getElementById('results-container').style.display = 'block';
            
            let errors = 0;
            let payload = [];
            let resultHtml = '';
            
            for(let i=0; i<questions.length; i++) {
                const q = questions[i];
                const userRec = answers[i] || { ans: null, guessed: false };
                
                const isCorrect = (userRec.ans === 'V' && q.risposta === 1) || (userRec.ans === 'F' && q.risposta === 0);
                if(!isCorrect) errors++;
                
                payload.push({
                    id: q.id,
                    is_correct: isCorrect,
                    is_guessed: userRec.guessed
                });
                
                const realAnsStr = q.risposta === 1 ? 'VERO' : 'FALSO';
                const userAnsStr = userRec.ans === 'V' ? 'VERO' : (userRec.ans === 'F' ? 'FALSO' : 'NON RISPOSTA');
                const cssClass = isCorrect ? 'res-correct' : 'res-wrong';
                const guessTag = userRec.guessed ? '<span style="color:#ffb74d;">(Tirato a indovinare)</span>' : '';
                
                resultHtml += `
                    <div class="result-item ${cssClass}">
                        <p><strong>${i+1}.</strong> ${q.domanda}</p>
                        <p>Tua Risposta: ${userAnsStr} ${guessTag} | Corretta: ${realAnsStr}</p>
                    </div>`;
            }
            
            document.getElementById('result-title').innerText = errors <= 3 ? "🟢 PROMOSSO" : "🔴 BOCCIATO";
            document.getElementById('result-title').style.color = errors <= 3 ? "#2ea043" : "#ff5252";
            document.getElementById('result-score').innerText = `Errori commessi: ${errors} / 30`;
            document.getElementById('result-list').innerHTML = resultHtml;
            
            // Submits exclusively to the new Jaccard endpoint
            await fetch('/api/submit_jaccard_exam', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers: payload })
            });
        }
    </script>
</body>
</html>
