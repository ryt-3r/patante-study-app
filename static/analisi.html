<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Database - Patente B</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            font-weight: 300; letter-spacing: -0.2px; margin: 0; padding: 0; min-height: 100vh;
            
            /* Dynasty Ambient Dark Room Mesh Gradient */
            background-color: #0a0a0f;
            background-image: 
                radial-gradient(circle at 0% 0%, #161e30 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, #1b1624 0%, transparent 50%);
            background-attachment: fixed;
            
            color: #d1d5db; 
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px 20px; }

        .menu-bar { 
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 12px 15px; border-radius: 16px; margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        
        .menu-left { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }

        .btn-home { 
            background: rgba(30, 41, 59, 0.8); color: #cbd5e1; text-decoration: none; 
            padding: 10px 20px; border-radius: 8px; font-weight: 600; border: 1px solid #475569; transition: 0.2s; 
        }
        .btn-home:hover { background: rgba(39, 55, 77, 0.9); color: #f8fafc; }

        .view-toggles { display: flex; gap: 10px; }
        .tab-btn {
            background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 8px 16px;
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .tab-btn:not(.active):hover { color: #f1f5f9; border-color: #94a3b8; background: rgba(56, 189, 248, 0.1); }

        /* Global IT/EN Translate Switch */
        .global-lang-toggle { 
            display: flex; background: rgba(15, 23, 42, 0.8); border-radius: 8px; 
            border: 1px solid #475569; overflow: hidden; 
        }
        .global-lang-toggle button { 
            background: transparent; border: none; color: #94a3b8; padding: 8px 16px; 
            font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9em; letter-spacing: 0.5px; 
        }
        .global-lang-toggle button.active { background: #38bdf8; color: #0f172a; }
        .global-lang-toggle button:not(.active):hover { color: #f1f5f9; background: rgba(56, 189, 248, 0.15); }

        .header-title { text-align: center; margin-bottom: 30px; }
        .header-title h1 { font-size: 2.5em; margin: 0; color: #f8fafc; }
        .header-title p { color: #94a3b8; font-size: 1.1em; margin-top: 5px; }

        .search-container { margin-bottom: 30px; width: 100%; }
        #search-bar {
            width: 100%; padding: 15px 20px; border-radius: 12px; border: 1px solid #475569; 
            background: rgba(15, 23, 42, 0.8); color: #f1f5f9; font-size: 1.1em; 
            box-sizing: border-box; outline: none; transition: all 0.2s; font-family: inherit;
        }
        #search-bar:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.2); }

        #stats-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-badge { background: rgba(30, 41, 59, 0.8); padding: 10px 20px; border-radius: 12px; border: 1px solid #334155; font-weight: 600; color: #f8fafc; }
        .stat-highlight { color: #38bdf8; font-size: 1.2em; }

        /* LUMINESCENT FILTER BUTTONS FOR UNIQUE TAB */
        .unique-filters { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        
        .filter-btn {
            padding: 12px 25px; border-radius: 14px; font-size: 1.05em; font-weight: 600; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; 
            background: rgba(30, 41, 59, 0.6); color: #cbd5e1; display: flex; align-items: center; gap: 10px;
        }

        /* Green Light */
        .filter-btn.vero-btn.active {
            background: rgba(6, 78, 59, 0.6); color: #6ee7b7; border-color: #34d399;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.4), inset 0 0 10px rgba(52, 211, 153, 0.2);
        }
        .filter-btn.vero-btn:not(.active) { opacity: 0.5; filter: grayscale(80%); border-color: #334155; }

        /* Red Light */
        .filter-btn.falso-btn.active {
            background: rgba(136, 19, 55, 0.6); color: #fca5a5; border-color: #fb7185;
            box-shadow: 0 0 20px rgba(251, 113, 133, 0.4), inset 0 0 10px rgba(251, 113, 133, 0.2);
        }
        .filter-btn.falso-btn:not(.active) { opacity: 0.5; filter: grayscale(80%); border-color: #334155; }

        /* GRID SYSTEM */
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        .analysis-card {
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid #334155; border-radius: 14px; 
            padding: 22px; transition: all 0.2s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .analysis-card:hover { border-color: #475569; background: rgba(30, 41, 59, 0.85); }

        /* FULL CARD TRUE (GREEN) & FALSE (RED) THEME FOR UNIQUE TAB */
        .analysis-card.card-always-true {
            background: linear-gradient(145deg, rgba(6, 78, 59, 0.35) 0%, rgba(30, 41, 59, 0.7) 100%);
            border: 1px solid rgba(52, 211, 153, 0.4);
            border-left: 6px solid #34d399;
        }
        .analysis-card.card-always-true:hover {
            background: linear-gradient(145deg, rgba(6, 78, 59, 0.5) 0%, rgba(30, 41, 59, 0.85) 100%);
            border-color: rgba(52, 211, 153, 0.7);
        }

        .analysis-card.card-always-false {
            background: linear-gradient(145deg, rgba(136, 19, 55, 0.35) 0%, rgba(30, 41, 59, 0.7) 100%);
            border: 1px solid rgba(251, 113, 133, 0.4);
            border-left: 6px solid #fb7185;
        }
        .analysis-card.card-always-false:hover {
            background: linear-gradient(145deg, rgba(136, 19, 55, 0.5) 0%, rgba(30, 41, 59, 0.85) 100%);
            border-color: rgba(251, 113, 133, 0.7);
        }

        /* COMFORTABLE READING TYPOGRAPHY */
        .q-text { 
            font-size: 1.15em; font-weight: 400; color: #f8fafc; 
            margin-bottom: 18px; display: block; line-height: 1.65; 
            letter-spacing: -0.1px;
        }
        
        .counter-group { display: flex; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; align-items: center; }
        .count-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.9em; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        
        .c-total { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
        
        .c-vero { 
            background: rgba(16, 185, 129, 0.15); color: #34d399; 
            border: 1px solid rgba(52, 211, 153, 0.4); 
        }
        .c-vero:hover { background: rgba(16, 185, 129, 0.3); color: #fff; border-color: #34d399; }

        .c-falso { 
            background: rgba(225, 29, 72, 0.15); color: #fb7185; 
            border: 1px solid rgba(251, 113, 133, 0.4); 
        }
        .c-falso:hover { background: rgba(225, 29, 72, 0.3); color: #fff; border-color: #fb7185; }

        .unique-loc { font-size: 0.9em; color: #cbd5e1; background: rgba(15, 23, 42, 0.5); padding: 8px 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.05); }

        /* MODAL WINDOW STYLES */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: #0f172a; border: 1px solid #334155; border-top: 4px solid #38bdf8;
            border-radius: 16px; width: 100%; max-width: 650px; max-height: 85vh;
            display: flex; flex-direction: column; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden;
        }
        @keyframes modalPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            padding: 20px; border-bottom: 1px solid #334155; display: flex; align-items: flex-start;
            justify-content: space-between; gap: 15px; background: rgba(30, 41, 59, 0.5);
        }
        .modal-title-area { flex: 1; }
        .modal-header h3 { margin: 0; font-size: 1.15em; color: #f8fafc; line-height: 1.5; }
        .modal-close-btn {
            background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9em; transition: 0.2s; flex-shrink: 0;
        }
        .modal-close-btn:hover { background: rgba(239, 68, 68, 0.3); color: #fff; }
        
        .modal-body { padding: 20px; overflow-y: auto; max-height: calc(85vh - 90px); }
        .modal-section-title { font-size: 0.9em; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
        .modal-section-title.v { color: #34d399; }
        .modal-section-title.f { color: #fb7185; }

        .log-item { 
            background: rgba(30, 41, 59, 0.6); padding: 10px 14px; border-radius: 8px; font-size: 0.95em; color: #cbd5e1; margin-bottom: 8px; 
            border-left: 3px solid #475569; display: flex; align-items: center; justify-content: space-between; gap: 15px;
        }
        .log-item.v-item { border-left-color: #34d399; background: rgba(16, 185, 129, 0.05); }
        .log-item.f-item { border-left-color: #fb7185; background: rgba(225, 29, 72, 0.05); }

        /* THUMBNAIL PREVIEW INSIDE MODAL */
        .thumb-container { position: relative; display: inline-block; flex-shrink: 0; }
        .thumb-img { 
            width: 36px; height: 36px; object-fit: contain; background: #ffffff; border-radius: 6px; padding: 2px; 
            vertical-align: middle; border: 1px solid #475569; 
        }
        .thumb-container .popup-preview {
            visibility: hidden; opacity: 0; position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%) scale(0.9);
            width: 120px; height: 120px; background: #ffffff; border-radius: 10px; padding: 6px; box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid #38bdf8; z-index: 1100;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }
        .thumb-container .popup-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .thumb-container:hover .popup-preview { visibility: visible; opacity: 1; transform: translateX(-50%) scale(1); }

        .loc-text { flex: 1; }
        #loader { text-align: center; color: #38bdf8; font-size: 1.2em; margin-top: 50px; font-weight: 500; }

        @media (max-width: 800px) {
            .menu-bar { flex-direction: column; gap: 15px; align-items: stretch; }
            .menu-left { justify-content: space-between; }
            .view-toggles { width: 100%; }
            .tab-btn { flex: 1; text-align: center; }
            #stats-bar { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="menu-bar">
            <div class="menu-left">
                <a href="/" class="btn-home">← Home</a>
                <div class="view-toggles">
                    <button class="tab-btn active" onclick="switchView('repeated')" id="btn-repeated">🔁 Ripetute</button>
                    <button class="tab-btn" onclick="switchView('unique')" id="btn-unique">✨ Uniche</button>
                </div>
            </div>
            <!-- Global IT/EN Switch -->
            <div class="global-lang-toggle">
                <button class="g-lang-it active" onclick="setGlobalLang('it')">IT</button>
                <button class="g-lang-en" onclick="setGlobalLang('en')">EN</button>
            </div>
        </div>

        <div class="header-title">
            <h1>Analisi Incrociata Database</h1>
            <p>Filtro anti-ridondanza: Esplora le ripetizioni e passa il mouse sulle miniature per visualizzare i segnali.</p>
        </div>

        <div id="stats-bar"></div>

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="🔍 Cerca una domanda specifica (es. spazio di frenatura)..." oninput="handleSearch()">
        </div>

        <div id="loader">Scansione dei 7000+ record in corso... ⏳</div>
        
        <div id="view-repeated" class="grid-layout" style="display: none;"></div>

        <!-- NEW UNIQUE VIEW CONTAINER WITH LUMINESCENT CONTROLS -->
        <div id="view-unique" style="display: none;">
            <div class="unique-filters">
                <button id="btn-filter-V" class="filter-btn vero-btn active" onclick="toggleUniqueFilter('V')">
                    🟢 Sempre Vero (0)
                </button>
                <button id="btn-filter-F" class="filter-btn falso-btn active" onclick="toggleUniqueFilter('F')">
                    🔴 Sempre Falso (0)
                </button>
            </div>
            <div id="unique-grid-container" class="grid-layout"></div>
        </div>
    </div>

    <!-- POPUP MODAL WINDOW -->
    <div class="modal-overlay" id="detailModal" onclick="closeModalOnOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-area">
                    <h3 id="modalQuestionTitle">Testo della domanda...</h3>
                </div>
                <button class="modal-close-btn" onclick="closeModal()">✕ Chiudi</button>
            </div>
            <div class="modal-body" id="modalBodyContent">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script>
        let dbData = { unique: [], repeated: [], total_processed: 0 };
        let currentLang = 'it';
        let translationCache = {};
        let activeModalItem = null;
        
        // Luminescent Filter State
        let uniqueFilters = { V: true, F: true };

        async function fetchAnalysis() {
            try {
                const res = await fetch('/api/analysis/duplicates');
                dbData = await res.json();
                
                document.getElementById('loader').style.display = 'none';
                renderStats();
                renderRepeated();
                renderUnique();
                switchView('repeated');
            } catch (e) {
                document.getElementById('loader').innerHTML = "<span style='color:#fb7185'>Errore di connessione al database.</span>";
            }
        }

        async function translateTextAPI(text) {
            if (!text || text === "N/A") return text;
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=it&tl=en&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            return data[0].map(item => item[0]).join('');
        }

        async function setGlobalLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.g-lang-it').forEach(el => el.classList.toggle('active', lang === 'it'));
            document.querySelectorAll('.g-lang-en').forEach(el => el.classList.toggle('active', lang === 'en'));

            if (document.getElementById('btn-repeated').classList.contains('active')) {
                renderRepeated();
            } else {
                renderUnique();
            }

            if (activeModalItem) {
                const modalTitle = document.getElementById('modalQuestionTitle');
                const rawText = activeModalItem.original || activeModalItem.domanda;
                if (lang === 'en') {
                    modalTitle.innerText = "Translating... ⏳";
                    modalTitle.innerText = await getCachedTranslation(rawText);
                } else {
                    modalTitle.innerText = rawText;
                }
            }
        }

        async function getCachedTranslation(text) {
            if (translationCache[text]) return translationCache[text];
            try {
                const translated = await translateTextAPI(text);
                translationCache[text] = translated;
                return translated;
            } catch (e) {
                return text;
            }
        }

        function renderStats() {
            document.getElementById('stats-bar').innerHTML = `
                <div class="stat-badge">Totale Pool: <span class="stat-highlight">${dbData.total_processed}</span></div>
                <div class="stat-badge">Testi Unici Assoluti: <span class="stat-highlight">${dbData.unique.length}</span></div>
                <div class="stat-badge">Testi Ripetuti: <span class="stat-highlight">${dbData.repeated.length}</span></div>
            `;
        }

        async function openModalByIndex(index, type) {
            const item = dbData.repeated[index];
            if (!item) return;

            activeModalItem = item;
            activeModalItem.modalType = type;

            const modal = document.getElementById('detailModal');
            const titleEl = document.getElementById('modalQuestionTitle');

            let displayTitle = item.original;
            if (currentLang === 'en') {
                titleEl.innerText = "Translating... ⏳";
                displayTitle = await getCachedTranslation(item.original);
            }

            titleEl.innerText = displayTitle;
            renderModalBody();
            modal.style.display = 'flex';
        }

        function renderModalBody() {
            const bodyEl = document.getElementById('modalBodyContent');
            const item = activeModalItem;
            const isVero = item.modalType === 'V';
            const titleClass = isVero ? 'v' : 'f';
            const titleLabel = isVero ? 'Esiti Vero (V)' : 'Esiti Falso (F)';
            const targetArray = isVero ? item.V : item.F;

            let itemsHTML = '';
            targetArray.forEach(loc => {
                itemsHTML += `<div class="log-item ${isVero ? 'v-item' : 'f-item'}">${formatLocation(loc)}</div>`;
            });

            bodyEl.innerHTML = `
                <div class="modal-section-title ${titleClass}">${titleLabel} (${targetArray.length}):</div>
                ${itemsHTML}
            `;
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
            activeModalItem = null;
        }

        function closeModalOnOutside(event) {
            if (event.target.id === 'detailModal') {
                closeModal();
            }
        }

        function formatLocation(locString) {
            const figMatch = locString.match(/\(Fig\. ([^)]+)\)/);
            if (!figMatch) return `<span class="loc-text">${locString}</span>`;

            const figPath = figMatch[1];
            const cleanLocText = locString.replace(/\s*\(Fig\. [^)]+\)/, '');

            return `
                <span class="loc-text">${cleanLocText}</span>
                <div class="thumb-container">
                    <img src="/${figPath}" class="thumb-img" alt="Segnale">
                    <div class="popup-preview">
                        <img src="/${figPath}" alt="Anteprima">
                    </div>
                </div>
            `;
        }

        function renderRepeated() {
            const container = document.getElementById('view-repeated');
            let html = '';
            
            dbData.repeated.forEach((item, index) => {
                const vCount = item.V.length;
                const fCount = item.F.length;
                const displayText = item.original;

                html += `
                <div class="analysis-card repeated-card" data-index="${index}">
                    <span class="q-text" id="q-text-rep-${index}">${displayText}</span>
                    <div class="counter-group">
                        <div class="count-badge c-total">Trovata ${item.count} volte</div>
                        ${vCount > 0 ? `<div class="count-badge c-vero" onclick="openModalByIndex(${index}, 'V')">Vero in ${vCount} casi ↗</div>` : ''}
                        ${fCount > 0 ? `<div class="count-badge c-falso" onclick="openModalByIndex(${index}, 'F')">Falso in ${fCount} casi ↗</div>` : ''}
                    </div>
                </div>`;
            });
            container.innerHTML = html;

            if (currentLang === 'en') {
                dbData.repeated.forEach(async (item, index) => {
                    const el = document.getElementById(`q-text-rep-${index}`);
                    if (el) {
                        el.innerText = await getCachedTranslation(item.original);
                    }
                });
            }
        }

        /* LUMINESCENT FILTER LOGIC */
        function toggleUniqueFilter(type) {
            uniqueFilters[type] = !uniqueFilters[type];
            document.getElementById(`btn-filter-${type}`).classList.toggle('active', uniqueFilters[type]);
            handleSearch(); // Reapply filters
        }

        function renderUnique() {
            const container = document.getElementById('unique-grid-container');
            let html = '';
            let countV = 0;
            let countF = 0;
            
            dbData.unique.forEach((item, index) => {
                const displayText = item.domanda;
                const isTrue = item.risposta === 'V';
                
                if (isTrue) countV++;
                else countF++;

                const cardThemeClass = isTrue ? 'card-always-true' : 'card-always-false';
                const badgeClass = isTrue ? 'c-vero' : 'c-falso';
                const ansLbl = isTrue ? 'Sempre Vero' : 'Sempre Falso';

                html += `
                <div class="analysis-card unique-card ${cardThemeClass}" data-index="${index}">
                    <span class="q-text" id="q-text-uni-${index}">${displayText}</span>
                    <div class="counter-group">
                        <div class="count-badge ${badgeClass}">${ansLbl}</div>
                        <div class="unique-loc">📍 ${formatLocation(item.location)}</div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;

            // Update Luminescent Button Labels (with translation support)
            let veroLbl = currentLang === 'en' ? 'Always True' : 'Sempre Vero';
            let falsoLbl = currentLang === 'en' ? 'Always False' : 'Sempre Falso';
            
            document.getElementById('btn-filter-V').innerHTML = `🟢 ${veroLbl} (${countV})`;
            document.getElementById('btn-filter-F').innerHTML = `🔴 ${falsoLbl} (${countF})`;

            // Process translations if EN active
            if (currentLang === 'en') {
                dbData.unique.forEach(async (item, index) => {
                    const el = document.getElementById(`q-text-uni-${index}`);
                    if (el) {
                        el.innerText = await getCachedTranslation(item.domanda);
                    }
                });
            }

            handleSearch(); // Ensure filters apply immediately upon render
        }

        function switchView(type) {
            document.getElementById('btn-repeated').classList.remove('active');
            document.getElementById('btn-unique').classList.remove('active');
            document.getElementById(`btn-${type}`).classList.add('active');
            
            document.getElementById('view-repeated').style.display = type === 'repeated' ? 'grid' : 'none';
            document.getElementById('view-unique').style.display = type === 'unique' ? 'block' : 'none';
            
            document.getElementById('search-bar').value = '';
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('search-bar').value.toLowerCase().trim();
            const isUniqueView = document.getElementById('btn-unique').classList.contains('active');
            
            if (!isUniqueView) {
                // Repeated Tab Search Logic
                const cards = document.querySelectorAll('.repeated-card');
                cards.forEach(card => {
                    const text = card.querySelector('.q-text').innerText.toLowerCase();
                    card.style.display = text.includes(query) ? 'block' : 'none';
                });
            } else {
                // Unique Tab Search & Luminescent Filter Logic
                const cards = document.querySelectorAll('.unique-card');
                cards.forEach(card => {
                    const isVeroCard = card.classList.contains('card-always-true');
                    const text = card.querySelector('.q-text').innerText.toLowerCase();
                    
                    const matchesSearch = text.includes(query);
                    const matchesFilter = (isVeroCard && uniqueFilters.V) || (!isVeroCard && uniqueFilters.F);
                    
                    if (matchesSearch && matchesFilter) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }
        }

        fetchAnalysis();
    </script>
</body>
</html>
