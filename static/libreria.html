<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libreria AI - Patente B</title>
    <style>
        /* Sleek, Native Apple Typography Stack */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            font-weight: 300; letter-spacing: -0.2px; margin: 0; padding: 0; min-height: 100vh;
            background-color: #0a0a0f;
            background-image: radial-gradient(circle at 0% 0%, #161e30 0%, transparent 50%), radial-gradient(circle at 100% 100%, #1b1624 0%, transparent 50%);
            background-attachment: fixed; color: #d1d5db; line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 80px 20px; }

        /* COMMAND CENTER (Matched to domande.html) */
        .menu-bar { 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 12px 15px; border-radius: 16px; margin: 25px 0; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155;
            display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; 
            justify-content: center; align-items: center; 
        }
        
        .btn-home-small { 
            background: rgba(30, 41, 59, 0.8); color: #cbd5e1; text-decoration: none; 
            padding: 10px 16px; border-radius: 8px; font-size: 0.95em; font-weight: 600; 
            border: 1px solid #475569; transition: 0.2s; white-space: nowrap;
        }
        .btn-home-small:hover { background: rgba(39, 55, 77, 0.9); color: #f8fafc; }

        .menu-bar select { 
            flex: 1; min-width: 180px; max-width: 280px; padding: 10px 12px; font-size: 0.95em; 
            font-family: inherit; font-weight: 400; border-radius: 8px; cursor: pointer; 
            background-color: #0f172a; color: #f1f5f9; border: 1px solid #475569; 
            transition: border 0.2s; outline: none; 
        }
        .menu-bar select:focus { border-color: #38bdf8; }
        .menu-bar select optgroup { font-weight: 600; color: #94a3b8; }

        #search-bar {
            flex: 1; min-width: 200px; max-width: 300px; padding: 10px 15px; border-radius: 8px; border: 1px solid #475569; 
            background: rgba(15, 23, 42, 0.8); color: #f1f5f9; font-size: 0.95em; 
            box-sizing: border-box; outline: none; transition: all 0.2s; font-family: inherit;
        }
        #search-bar:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.2); }
        #search-bar::placeholder { color: #64748b; }

        /* HEADER */
        .header-title { text-align: center; margin-bottom: 20px; }
        .header-title h1 { font-size: 2.2em; margin: 0; color: #f8fafc; }
        .header-title p { color: #94a3b8; font-size: 1.05em; margin-top: 5px; }

        /* GALLERY GRID */
        .col-title {
            color: #f8fafc; border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            padding-bottom: 10px; margin-top: 30px; margin-bottom: 20px; font-size: 1.4em;
        }
        .col-title.high { border-color: rgba(248, 113, 113, 0.5); }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; width: 100%; margin-bottom: 30px; }
        .gallery-item { background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 16px; padding: 15px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 15px; }
        .gallery-item:hover { transform: translateY(-4px); background: rgba(39, 53, 73, 0.8); border-color: #38bdf8; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
        .gallery-img-wrapper { width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; background: #ffffff; border-radius: 10px; overflow: hidden; padding: 10px; box-sizing: border-box; }
        .gallery-img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
        .no-img-square { color: #64748b; font-style: italic; font-size: 0.9em; text-align: center; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.5); border-radius: 8px; }
        .gallery-title { font-size: 1.05em; font-weight: 500; color: #f8fafc; text-align: center; line-height: 1.3; }

        /* STUDY CARDS */
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .ai-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid #334155; border-top: 4px solid #38bdf8; border-radius: 12px; 
            padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; gap: 15px; transition: transform 0.2s; overflow: hidden;
        }
        .ai-card:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 15px; }
        .card-title-group { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; flex: 1; padding-right: 15px; min-width: 0; }
        .card-title { font-size: 1.1em; font-weight: 600; color: #e0f2fe; margin: 0; text-transform: capitalize; line-height: 1.3; overflow-wrap: break-word; word-break: break-word; }
        .card-subtitle { font-size: 0.85em; color: #94a3b8; margin: 0; font-weight: 500; }
        .card-image { width: 75px; height: 75px; background: white; border-radius: 8px; padding: 5px; object-fit: contain; flex-shrink: 0; }

        /* LANG TOGGLE & HINTS */
        .lang-toggle { display: flex; background: rgba(15, 23, 42, 0.8); border-radius: 6px; border: 1px solid #475569; overflow: hidden; }
        .lang-toggle button { background: transparent; border: none; color: #94a3b8; padding: 4px 10px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.75em; }
        .lang-toggle button.active { background: #38bdf8; color: #0f172a; }
        .hint-section { margin-bottom: 12px; }
        .hint-label { font-weight: 600; color: #94a3b8; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 3px;}
        .hint-text { color: #f1f5f9; font-size: 0.95em; line-height: 1.5; display: block; overflow-wrap: break-word; word-break: break-word; }
        .trap-text { color: #fca5a5; font-weight: 500; } 
        .rule-text { color: #6ee7b7; font-weight: 400; }

        #loader { text-align: center; color: #38bdf8; font-size: 1.2em; margin-top: 50px; font-weight: 500; }
        #view-dashboard, #view-topic, #view-search { display: none; }
        
        /* NEW DEDICATED BACK BUTTON HEADER */
        .topic-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-top: 10px; }
        .topic-top-bar h2 { margin: 0; color: #f8fafc; font-size: 1.6em; }
        .btn-return {
            background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 1em; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-return:hover { background: rgba(56, 189, 248, 0.3); color: #fff; transform: translateX(-3px); }

        @media (max-width: 800px) {
            .menu-bar { padding: 10px; margin: 15px 0; gap: 8px; border-radius: 12px; flex-direction: column; }
            .menu-bar select, #search-bar, .btn-home-small { width: 100%; text-align: center; max-width: none; }
            .library-grid { grid-template-columns: 1fr; }
            .topic-top-bar { flex-direction: column; gap: 15px; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="menu-bar">
            <a href="/" class="btn-home-small">← Home</a>
            <select id="cat-select" class="category-select" onchange="onCatChange()">
                <option value="all">Scegli il Capitolo...</option>
            </select>
            <input type="text" id="search-bar" placeholder="🔍 Cerca (es. incrocio, 145)..." oninput="handleSearch()">
        </div>

        <div class="header-title" id="main-header">
            <h1>Libreria Trucchi AI</h1>
            <p>I tuoi appunti intelligenti, sincronizzati con il database ufficiale.</p>
        </div>

        <div id="loader">Sincronizzazione con il database ufficiale in corso... ⏳</div>
        
        <div id="view-dashboard">
            <h2 class="col-title high">🔴 15 Argomenti Più Importanti (Alta Priorità)</h2>
            <div class="gallery-grid" id="grid-high"></div>

            <h2 class="col-title">🔵 10 Argomenti Meno Importanti</h2>
            <div class="gallery-grid" id="grid-normal"></div>
        </div>

        <div id="view-topic">
            <div class="topic-top-bar">
                <h2 id="topic-title-display">Titolo</h2>
                <button class="btn-return" onclick="goBackToDashboard()">← Torna alle Categorie</button>
            </div>
            <div class="library-grid" id="topic-grid"></div>
        </div>

        <div id="view-search">
            <div class="topic-top-bar">
                <h2>🔍 Risultati Ricerca</h2>
                <button class="btn-return" onclick="goBackToDashboard()">← Torna Indietro</button>
            </div>
            <div class="library-grid" id="search-grid"></div>
            <div id="no-results-msg" style="display: none; text-align: center; color: #94a3b8; padding: 40px; font-size: 1.1em;">
                Nessun risultato trovato.
            </div>
        </div>
    </div>

    <script>
        let imageCheatsheets = {};
        let textCheatsheets = {};
        
        window.cardStore = {}; 
        window.allCardsList = []; 
        window.categoryMap = { high: {}, normal: {} }; 
        
        let figureToMeta = {}; 
        let subcatToMeta = {};

        function cleanText(text) { 
            if (!text) return "Sconosciuto";
            return String(text).split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '); 
        }

        async function initApp() {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            // 1. Fetch JSONs
            try {
                const [imgRes, txtRes] = await Promise.all([
                    fetch('/static/cheatsheets.json'),
                    fetch('/static/text_cheatsheets.json')
                ]);
                if (imgRes.ok) imageCheatsheets = await imgRes.json();
                if (txtRes.ok) textCheatsheets = await txtRes.json();
            } catch (e) { 
                loader.innerHTML = "<span style='color:#fca5a5'>Errore caricamento file JSON.</span>";
                return;
            }

            // 2. Fetch DB Structure Concurrently (Fast Loading)
            try {
                const catRes = await fetch('/api/categories');
                const categories = await catRes.json();
                
                if (!Array.isArray(categories)) throw new Error("API returned invalid data.");

                const subcatPromises = categories.map(async (cat) => {
                    const subRes = await fetch(`/api/subcategories?category=${encodeURIComponent(cat.name)}`);
                    const subcats = await subRes.json();
                    
                    if (!Array.isArray(subcats)) return;

                    const figPromises = subcats.map(async (sub) => {
                        // Normalize subcategory name for strict matching
                        const cleanSub = sub.name.toLowerCase().trim();
                        subcatToMeta[cleanSub] = { category: cat.name, is_important: cat.is_important };
                        
                        const figRes = await fetch(`/api/figures?category=${encodeURIComponent(cat.name)}&subcategory=${encodeURIComponent(sub.name)}`);
                        const figures = await figRes.json();
                        
                        if (Array.isArray(figures)) {
                            figures.forEach(fig => {
                                if (fig.name && fig.name !== 'no_image' && fig.name !== 'all') {
                                    // Extract just "1.png" regardless of folder prefixes
                                    const cleanFigName = fig.name.split('/').pop();
                                    figureToMeta[cleanFigName] = { category: cat.name, subcategory: sub.name, is_important: cat.is_important };
                                }
                            });
                        }
                    });
                    await Promise.all(figPromises);
                });
                
                await Promise.all(subcatPromises);
            } catch (e) { 
                console.error(e);
                loader.innerHTML = "<span style='color:#fca5a5'>Errore di connessione al database FastAPI.</span>";
                return;
            }

            // 3. Process the Data (Strict Mapping)
            let count = 0;

            for (const [path, data] of Object.entries(imageCheatsheets)) {
                count++;
                // Strip the path to strictly match the normalized DB name (e.g. "img_sign/1.png" -> "1.png")
                const cleanJsonPath = path.split('/').pop();
                const meta = figureToMeta[cleanJsonPath] || { category: "Segnali Misti (Non Classificati)", subcategory: "Varie", is_important: false };
                
                const group = meta.is_important ? 'high' : 'normal';
                const catName = meta.category;
                const title = cleanText(cleanJsonPath.replace('.png','').replace('.jpg',''));
                
                if (!window.categoryMap[group][catName]) window.categoryMap[group][catName] = [];
                const card = { id: `item_${count}`, title: title, path: path, data: data, subcategory: meta.subcategory, category: catName };
                window.categoryMap[group][catName].push(card);
                window.allCardsList.push(card);
            }

            for (const [topic, data] of Object.entries(textCheatsheets)) {
                count++;
                const cleanTopic = topic.toLowerCase().trim();
                const meta = subcatToMeta[cleanTopic] || { category: "Argomenti Generici (Non Classificati)", is_important: false };
                
                const group = meta.is_important ? 'high' : 'normal';
                const catName = meta.category;
                const title = cleanText(topic);
                
                if (!window.categoryMap[group][catName]) window.categoryMap[group][catName] = [];
                const card = { id: `item_${count}`, title: title, path: null, data: data, subcategory: topic, category: catName };
                window.categoryMap[group][catName].push(card);
                window.allCardsList.push(card);
            }

            loader.style.display = 'none';
            buildDashboard();
            populateCategoryDropdown();
            showView('dashboard');
        }

        function populateCategoryDropdown() {
            const catSelect = document.getElementById('cat-select');
            let impGroup = `<optgroup label="15 Argomenti Più Importanti (Alta Priorità)">`;
            let lessGroup = `<optgroup label="10 Argomenti Meno Importanti">`;

            const sortAndAdd = (groupData, htmlString) => {
                const sortedCategories = Object.keys(groupData).sort((a, b) => groupData[b].length - groupData[a].length);
                sortedCategories.forEach(cat => {
                    htmlString += `<option value="${cat}">${cleanText(cat)} (${groupData[cat].length} schede)</option>`;
                });
                return htmlString;
            };

            impGroup = sortAndAdd(window.categoryMap.high, impGroup) + `</optgroup>`;
            lessGroup = sortAndAdd(window.categoryMap.normal, lessGroup) + `</optgroup>`;
            
            catSelect.innerHTML = `<option value="all">Scegli il Capitolo...</option>` + impGroup + lessGroup;
        }

        function buildDashboard() {
            const gridHigh = document.getElementById('grid-high');
            const gridNormal = document.getElementById('grid-normal');

            const createSection = (groupData, container) => {
                const sortedCategories = Object.keys(groupData).sort((a, b) => groupData[b].length - groupData[a].length);

                sortedCategories.forEach(category => {
                    const cards = groupData[category];
                    
                    const imgCard = cards.find(c => c.path);
                    const thumbHTML = imgCard 
                        ? `<img src="/${imgCard.path}" loading="lazy" alt="Anteprima">` 
                        : `<div class="no-img-square">Nessuna Immagine</div>`;

                    const safeCat = category.replace(/'/g, "\\'");
                    const itemHTML = `
                        <div class="gallery-item" onclick="openTopic('${safeCat}')">
                            <div class="gallery-img-wrapper">${thumbHTML}</div>
                            <div class="gallery-title">${cleanText(category)} <br><span style="color:#94a3b8; font-size:0.85em;">(${cards.length} schede)</span></div>
                        </div>
                    `;
                    container.innerHTML += itemHTML;
                });
            };

            createSection(window.categoryMap.high, gridHigh);
            createSection(window.categoryMap.normal, gridNormal);
        }

        function onCatChange() {
            const catName = document.getElementById('cat-select').value;
            if(catName === 'all') {
                goBackToDashboard();
                return;
            }
            openTopic(catName);
        }

        function showView(viewName) {
            document.getElementById('view-dashboard').style.display = 'none';
            document.getElementById('view-topic').style.display = 'none';
            document.getElementById('view-search').style.display = 'none';
            document.getElementById('main-header').style.display = 'none';

            if (viewName === 'dashboard') {
                document.getElementById('view-dashboard').style.display = 'block';
                document.getElementById('main-header').style.display = 'block';
                document.getElementById('search-bar').value = ''; 
                document.getElementById('cat-select').value = 'all';
            } else if (viewName === 'topic') {
                document.getElementById('view-topic').style.display = 'block';
            } else if (viewName === 'search') {
                document.getElementById('view-search').style.display = 'block';
                document.getElementById('cat-select').value = 'all';
            }
        }

        function openTopic(categoryName) {
            document.getElementById('cat-select').value = categoryName;
            
            let displayTitle = cleanText(categoryName);
            document.getElementById('topic-title-display').innerText = displayTitle;
            
            const grid = document.getElementById('topic-grid');
            grid.innerHTML = ''; 
            
            const group = window.categoryMap.high[categoryName] ? window.categoryMap.high : window.categoryMap.normal;
            let cards = group[categoryName] || [];
            
            cards.sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }));

            cards.forEach(card => {
                grid.innerHTML += buildCard(card.id, card.title, card.path, card.data, card.subcategory);
            });
            
            showView('topic');
            window.scrollTo(0, 0);
        }

        function goBackToDashboard() {
            showView('dashboard');
        }

        function handleSearch() {
            const query = document.getElementById('search-bar').value.toLowerCase().trim();
            const searchGrid = document.getElementById('search-grid');
            const noResultsMsg = document.getElementById('no-results-msg');
            
            if (query === '') {
                showView('dashboard');
                return;
            }

            showView('search');
            searchGrid.innerHTML = '';
            let matchCount = 0;

            window.allCardsList.forEach(card => {
                const title = card.title.toLowerCase();
                const sub = (card.subcategory || "").toLowerCase();
                const trapText = (card.data.parole_trappola || "").toLowerCase();
                const ruleText = (card.data.regola_base || "").toLowerCase();
                
                if (title.includes(query) || sub.includes(query) || trapText.includes(query) || ruleText.includes(query)) {
                    searchGrid.innerHTML += buildCard(card.id, card.title, card.path, card.data, card.subcategory);
                    matchCount++;
                }
            });

            if (matchCount === 0) {
                noResultsMsg.style.display = 'block';
            } else {
                noResultsMsg.style.display = 'none';
            }
        }

        async function translateTextAPI(text) {
            if (!text || text === "N/A") return text;
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=it&tl=en&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            return data[0].map(item => item[0]).join('');
        }

        async function switchLang(id, lang) {
            document.getElementById(`btn-it-${id}`).classList.remove('active');
            document.getElementById(`btn-en-${id}`).classList.remove('active');
            document.getElementById(`btn-${lang}-${id}`).classList.add('active');

            const data = window.cardStore[id];
            const ruleEl = document.getElementById(`text-rule-${id}`);
            const trapEl = document.getElementById(`text-trap-${id}`);
            const excEl = document.getElementById(`text-exc-${id}`);
            
            if (lang === 'it') {
                ruleEl.innerText = data.it.regola_base || "N/A";
                trapEl.innerText = data.it.parole_trappola || "N/A";
                excEl.innerText = data.it.eccezioni_e_contesti || "N/A";
                return;
            }

            if (lang === 'en') {
                if (data.en) {
                    ruleEl.innerText = data.en.regola_base;
                    trapEl.innerText = data.en.parole_trappola;
                    excEl.innerText = data.en.eccezioni_e_contesti;
                } else {
                    ruleEl.innerText = "Translating... ⏳"; trapEl.innerText = "Translating... ⏳"; excEl.innerText = "Translating... ⏳";
                    try {
                        const rule = await translateTextAPI(data.it.regola_base);
                        const trap = await translateTextAPI(data.it.parole_trappola);
                        const exc = await translateTextAPI(data.it.eccezioni_e_contesti);
                        data.en = { regola_base: rule, parole_trappola: trap, eccezioni_e_contesti: exc };
                        ruleEl.innerText = rule; trapEl.innerText = trap; excEl.innerText = exc;
                    } catch (e) { ruleEl.innerText = "Translation error."; }
                }
            }
        }

        function buildCard(id, title, imgPath, cheatData, subcategory) {
            window.cardStore[id] = { it: cheatData, en: null };
            let imgHTML = imgPath ? `<img src="/${imgPath}" class="card-image" loading="lazy" alt="Figura">` : '';
            let subLabel = subcategory && subcategory !== "Varie" ? `<p class="card-subtitle">Argomento: ${cleanText(subcategory)}</p>` : '';
            
            return `
            <div class="ai-card">
                <div class="card-header">
                    <div class="card-title-group">
                        <h3 class="card-title">${title}</h3>
                        ${subLabel}
                        <div class="lang-toggle" style="margin-top: 5px;">
                            <button class="active" id="btn-it-${id}" onclick="switchLang('${id}', 'it')">IT</button>
                            <button id="btn-en-${id}" onclick="switchLang('${id}', 'en')">EN</button>
                        </div>
                    </div>
                    ${imgHTML}
                </div>
                
                <div class="hint-section">
                    <span class="hint-label">🎯 Regola Base (Vero)</span>
                    <span class="hint-text rule-text" id="text-rule-${id}">${cheatData.regola_base || "N/A"}</span>
                </div>
                
                <div class="hint-section">
                    <span class="hint-label">🚩 Parole Trappola (Falso)</span>
                    <span class="hint-text trap-text" id="text-trap-${id}">${cheatData.parole_trappola || "N/A"}</span>
                </div>
                
                <div class="hint-section">
                    <span class="hint-label">⚠️ Eccezioni e Limiti</span>
                    <span class="hint-text" id="text-exc-${id}">${cheatData.eccezioni_e_contesti || "N/A"}</span>
                </div>
            </div>`;
        }

        initApp();
    </script>
</body>
</html>
